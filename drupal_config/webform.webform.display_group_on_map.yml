id: display_group_on_map
title: 'Display Group on Map'
description: ''
categories: {  }
elements: |-
  civicrm_1_contact_1_contact_existing:
    '#type': civicrm_contact
    '#title': 'Existing Contact'
    '#widget': hidden
    '#none_prompt': '+ Create new +'
    '#results_display':
      display_name: display_name
    '#default': user
    '#allow_create': 1
    '#contact_type': individual
    '#form_key': civicrm_1_contact_1_contact_existing
    '#parent': civicrm_1_contact_1_fieldset_fieldset
    '#extra': {  }
    '#required': true
  civicrm_2_contact_1_contact_existing:
    '#type': civicrm_contact
    '#title': 'Existing Contact'
    '#widget': hidden
    '#none_prompt': '+ Create new +'
    '#results_display':
      display_name: display_name
    '#default': relationship
    '#default_relationship_to': '1'
    '#default_relationship':
      11_b: 11_b
    '#allow_url_autofill': false
    '#filter_relationship_contact': ''
    '#filter_relationship_types':
      11_b: 11_b
    '#allow_create': 1
    '#contact_type': household
    '#form_key': civicrm_2_contact_1_contact_existing
    '#parent': civicrm_2_contact_1_fieldset_fieldset
    '#extra': {  }
    '#required': true
  civicrm_1_contact_1_contact_cs:
    '#type': hidden
    '#title': Checksum
    '#value': '7'
    '#form_key': civicrm_1_contact_1_contact_cs
    '#parent': civicrm_1_contact_1_fieldset_fieldset
    '#extra': {  }
  markup:
    '#type': webform_markup
    '#markup': '<p>Please confirm whether you would like to have your group displayed on the Kin map. The map helps people find groups local to them. It will not include any contact details, only the name of the group, the group type and public description. People will need to contact Kin to get the contact details for any group.</p>'
  civicrm_2_contact_1_contact_household_name:
    '#type': textfield
    '#title': Group
    '#readonly': true
    '#counter_type': character
    '#counter_maximum': 128
    '#counter_maximum_message': ' '
    '#contact_type': household
    '#form_key': civicrm_2_contact_1_contact_household_name
    '#extra':
      width: 20
    '#parent': civicrm_2_contact_1_fieldset_fieldset
    '#required': true
  civicrm_2_contact_1_cg42_custom_221:
    '#type': civicrm_options
    '#title': 'Display on Map'
    '#civicrm_live_options': 0
    '#options':
      1: 'Yes'
      0: 'No'
    '#required': true
    '#data_type': Boolean
    '#has_help': true
    '#form_key': civicrm_2_contact_1_cg42_custom_221
    '#parent': civicrm_2_contact_1_cg42_fieldset
    '#default_option': ''
    '#default_value': ''
  civicrm_2_contact_1_address_city:
    '#type': textfield
    '#title': City
    '#required': true
    '#counter_type': character
    '#counter_maximum': 64
    '#counter_maximum_message': ' '
    '#states':
      visible:
        ':input[name="civicrm_2_contact_1_cg42_custom_221"]':
          value: '1'
    '#extra':
      width: 20
    '#form_key': civicrm_2_contact_1_address_city
    '#parent': civicrm_2_contact_1_fieldset_fieldset
  civicrm_2_contact_1_address_postal_code:
    '#type': textfield
    '#title': 'Post Code Prefix'
    '#description': '<p>Please enter the first part of the post code only, to give the approximate location, eg SW13, HU5 etc</p>'
    '#required': true
    '#counter_type': character
    '#counter_maximum': 64
    '#counter_maximum_message': ' '
    '#states':
      visible:
        ':input[name="civicrm_2_contact_1_cg42_custom_221"]':
          value: '1'
    '#extra':
      width: 7
    '#form_key': civicrm_2_contact_1_address_postal_code
    '#parent': civicrm_2_contact_1_fieldset_fieldset
  civicrm_2_contact_1_cg42_custom_222:
    '#type': civicrm_options
    '#data_type': String
    '#extra':
      description: 'What type of financial mutual aid group are you?'
      description_above: 0
      aslist: 1
      items: |-
        Food cooperative|Food cooperative
        Savings club|Savings club
        Other|Other
    '#has_help': true
    '#form_key': civicrm_2_contact_1_cg42_custom_222
    '#options':
      'Food cooperative': 'Food cooperative'
      'Savings club': 'Savings club'
      Other: Other
    '#parent': civicrm_2_contact_1_cg42_fieldset
    '#title': 'Group Type'
    '#civicrm_live_options': 1
    '#required': true
  civicrm_2_contact_1_cg42_custom_223:
    '#type': textfield
    '#title': 'Group Type Other'
    '#description': '<p>What is your group type?</p>'
    '#counter_type': character
    '#counter_maximum': 255
    '#counter_maximum_message': ' '
    '#states':
      visible:
        ':input[name="civicrm_2_contact_1_cg42_custom_222"]':
          value: Other
    '#data_type': String
    '#form_key': civicrm_2_contact_1_cg42_custom_223
    '#extra':
      width: 20
    '#parent': civicrm_2_contact_1_cg42_fieldset
    '#required': true
  civicrm_2_contact_1_cg42_custom_224:
    '#type': textarea
    '#title': 'Public Group Description'
    '#description': '<p>Enter a brief public description for your group. <em>e.g. is the group open to new members?</em></p>'
    '#states':
      visible:
        ':input[name="civicrm_2_contact_1_cg42_custom_221"]':
          value: '1'
    '#data_type': Memo
    '#extra':
      description: 'A description for the general public'
      description_above: 0
      cols: '60'
      rows: '4'
    '#has_help': true
    '#form_key': civicrm_2_contact_1_cg42_custom_224
    '#parent': civicrm_2_contact_1_cg42_fieldset
