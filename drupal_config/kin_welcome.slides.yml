slides:
  slide_1:
    title: 'Now complete your membership'
    body: '<p>Before you can use Kin you must set up your monthly membership donation.</p><div style="font-family:Arial,Helvetica,sans-serif;margin:0 auto;max-width:420px;"><!-- SIGN UP --><div style="background-color:#fff;border-radius:4px;border:3px solid #000;box-sizing:border-box;padding:16px 18px;text-align:center;"><div style="color:#000;font-size:22px;"><strong>Sign up</strong></div></div><!-- arrow down (centred) + YOU ARE HERE label to the side --><div style="height:52px;position:relative;"><div style="background-color:#000;height:100%;left:50%;position:absolute;top:0;transform:translateX(-50%);width:3px;"><div style="border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid #000;bottom:0;height:0;left:50%;position:absolute;transform:translateX(-50%);width:0;">&nbsp;</div></div><div style="color:#E6460F;font-size:13px;left:calc(50% + 16px);letter-spacing:.4px;position:absolute;top:50%;transform:translateY(-50%);white-space:nowrap;"><strong>YOU ARE HERE</strong></div></div><!-- STEP 1 --><div style="background-color:#fff;border-radius:4px;border:3px solid #000;box-sizing:border-box;padding:16px 18px;text-align:center;"><div style="color:#000;font-size:22px;"><strong>Step 1</strong></div><div style="color:#000;font-size:15px;line-height:1.4;margin-top:6px;">Set up a monthly membership donation to Kin</div></div><!-- arrow down --><div style="display:flex;height:44px;justify-content:center;"><div style="background-color:#000;height:100%;position:relative;width:3px;"><div style="border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid #000;bottom:0;height:0;left:50%;position:absolute;transform:translateX(-50%);width:0;">&nbsp;</div></div></div><!-- STEP 2 --><div style="background-color:#fff;border-radius:4px;border:3px solid #000;box-sizing:border-box;padding:16px 18px;text-align:center;"><div style="color:#000;font-size:22px;"><strong>Step 2</strong></div><div style="color:#000;font-size:15px;line-height:1.4;margin-top:6px;">Kin verifies your first donation has been received</div></div><!-- arrow down --><div style="display:flex;height:44px;justify-content:center;"><div style="background-color:#000;height:100%;position:relative;width:3px;"><div style="border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid #000;bottom:0;height:0;left:50%;position:absolute;transform:translateX(-50%);width:0;">&nbsp;</div></div></div><!-- MEMBERSHIP CONFIRMED --><div style="background-color:#2D4C9B;border-radius:4px;border:3px solid #2D4C9B;box-sizing:border-box;padding:18px;text-align:center;"><div style="color:#fff;font-size:22px;"><strong>Membership confirmed</strong></div><div style="color:#fff;font-size:15px;line-height:1.4;margin-top:6px;">Use Kin to contribute to and receive money from your groups</div></div></div>'
    body_format: full_html
  slide_2:
    title: 'Step 1'
    body: '<p>All members donate a <em>minimum</em> of £1 per month.&nbsp;</p><p style="color:#000;font-size:0.9em;">If you have a stable income, please donate more. If £1 per month would create hardship, please get in touch with the Kin Team to discuss a solidarity membership by <a href="https://wa.me/447985022771?">WhatsApp</a> or <a href="https://kin.coop/contact">email</a>.&nbsp;</p><p>&nbsp;</p><div style="align-items:center;display:flex;flex-wrap:wrap;font-family:Arial,Helvetica,sans-serif;gap:10px;justify-content:center;margin:0 auto;max-width:500px;"><!-- YOU figure --><div style="align-items:center;display:flex;flex-direction:column;flex:0 0 auto;width:84px;"><div style="background-color:#1a1a1a;border-radius:50%;height:46px;width:46px;">&nbsp;</div><div style="background-color:#1a1a1a;border-radius:18px;height:62px;margin-top:6px;transform:rotate(45deg);width:62px;">&nbsp;</div><div style="color:#1a1a1a;font-size:16px;margin-top:20px;">You</div></div><!-- ARROW with label --><div style="flex:0 0 130px;height:60px;position:relative;"><div style="color:#2D4C9B;font-size:14px;left:50%;position:absolute;top:4px;transform:translateX(-50%);white-space:nowrap;">Monthly donation</div><div style="background-color:#2D4C9B;height:2px;left:0;position:absolute;top:38px;width:100%;">&nbsp;</div><div style="border-bottom:6px solid transparent;border-left:10px solid #2D4C9B;border-top:6px solid transparent;height:0;position:absolute;right:0;top:39px;transform:translateY(-50%);width:0;">&nbsp;</div></div><!-- KIN circle (smaller) --><div style="align-items:center;border-radius:50%;border:2px solid #2D4C9B;box-sizing:border-box;display:flex;flex-direction:column;flex:0 0 auto;height:140px;justify-content:center;width:140px;"><div style="color:#1a1a1a;font-size:26px;letter-spacing:2px;">KIN</div><div style="color:#444;font-size:10px;letter-spacing:2px;margin-top:3px;">CO-OPERATIVE</div></div></div>'
    body_format: full_html
  slide_3:
    title: 'Step 2'
    body: '<p>When your first donation is received, Kin will send an email confirming your membership. Then you can create, join and contribute to your groups!</p><p><strong>Please note that confirmation can take up to 24 hours for new members.&nbsp;</strong></p><div style="align-items:center;display:flex;flex-wrap:wrap;font-family:Arial,Helvetica,sans-serif;gap:10px;justify-content:center;margin:0 auto;max-width:500px;"><!-- KIN circle with heading above (smaller) --><div style="align-items:center;display:flex;flex-direction:column;flex:0 0 auto;width:140px;"><div class="text-align-center" style="color:#1a1a1a;font-size:18px;line-height:1.25;margin-bottom:12px;"><strong>Donation</strong><br><strong>received</strong></div><div style="align-items:center;border-radius:50%;border:2px solid #2D4C9B;box-sizing:border-box;display:flex;flex-direction:column;height:140px;justify-content:center;width:140px;"><div style="color:#1a1a1a;font-size:26px;letter-spacing:2px;">KIN</div><div style="color:#444;font-size:10px;letter-spacing:2px;margin-top:3px;">CO-OPERATIVE</div></div></div><!-- ARROW with label --><div style="flex:0 0 130px;height:60px;position:relative;"><div style="color:#E6460F;font-size:14px;left:50%;position:absolute;top:4px;transform:translateX(-50%);white-space:nowrap;">Confirmation email</div><div style="background-color:#E6460F;height:2px;left:0;position:absolute;top:38px;width:100%;">&nbsp;</div><div style="border-bottom:6px solid transparent;border-left:10px solid #E6460F;border-top:6px solid transparent;height:0;position:absolute;right:0;top:39px;transform:translateY(-50%);width:0;">&nbsp;</div></div><!-- YOU figure with heading above --><div style="align-items:center;display:flex;flex-direction:column;flex:0 0 auto;width:130px;"><div class="text-align-center" style="color:#1a1a1a;font-size:18px;line-height:1.25;margin-bottom:12px;"><strong>Membership</strong><br><strong>confirmed!</strong></div><div style="background-color:#1a1a1a;border-radius:50%;height:46px;width:46px;">&nbsp;</div><div style="background-color:#1a1a1a;border-radius:18px;height:62px;margin-top:6px;transform:rotate(45deg);width:62px;">&nbsp;</div><div style="color:#1a1a1a;font-size:16px;margin-top:20px;">You</div></div></div>'
    body_format: full_html
  slide_4:
    title: 'Ready to complete your membership?'
    body: '<p>Kin is only available to members with active monthly donations.</p><p>Please follow the instructions on the next page carefully.&nbsp;</p>'
    body_format: basic_html
    link_text: 'Set Up Membership'
    link_url: '/civicrm/contribute/transact?reset=1&id=8&groupid=425'
