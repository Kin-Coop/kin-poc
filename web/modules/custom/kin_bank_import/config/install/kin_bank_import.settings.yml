# The three "next steps" buttons shown on the import page.
# url: an internal path starting with "/" or a full https:// URL.
# PLACEHOLDERS: replace with the real labels, links and instructions.
next_steps:
  -
    label: 'Import cleaned csv file'
    url: '/civicrm/csvimporter/import'
    instructions: 'Import the cleaned csv file into CiviCRM to get the payments.'
  -
    label: 'Execute Recurring Offline Payments and Match Payments'
    url: '/civicrm/admin/job?reset=1'
    instructions: 'Execute the Offline Payments Recurring Contributions Generation job, and then the Match Payments job'
  -
    label: 'Check unmatched payments'
    url: '/civicrm/kin-payments'
    instructions: 'In the status filter, select Not Found and Matched Pending to get a list of all the payments that either have not been matched against contributions or which have been matched but the member is pending. It is then important to go through each of these to find out why they have not been matched by looking for the contributions for those individuals.'
