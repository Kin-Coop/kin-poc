site_name:  SearchKit Maps Display
repo_url: https://lab.civicrm.org/extensions/searchkitmaps
theme:
  name: material
markdown_extensions:
  - attr_list
  - admonition
  - def_list
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tilde
  - pymdownx.betterem
  - pymdownx.mark

nav:
- About: index.md
- Development: development.md
- Release Notes: releasenotes.md
